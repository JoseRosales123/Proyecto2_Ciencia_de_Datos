version: 2

models:

  - name: dim_usuario

    columns:

      - name: usuario_key
        data_tests:
          - not_null
          - unique

      - name: usuario_seudonimo
        data_tests:
          - not_null
          - unique

      - name: cantidad_sistemas
        data_tests:
          - not_null

      - name: sistemas_asociados
        data_tests:
          - not_null

      - name: es_multimodal_aprox
        data_tests:
          - not_null

      - name: estrategia_identidad
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - IDENTIDAD_SEPARADA_AEROMETRO
                  - IDENTIDAD_NUMERICA_APROX


  - name: dim_punto_servicio

    columns:

      - name: punto_servicio_key
        data_tests:
          - not_null
          - unique

      - name: modo_key
        data_tests:
          - not_null

      - name: punto_id
        data_tests:
          - not_null

      - name: zona_key
        data_tests:
          - not_null