version: 2

models:
  - name: dim_tiempo
    description: >
      Dimension temporal compartida por los procesos de abordajes
      y viajes de la Red Metropolitana. Su grano es una combinación
      única de fecha y hora.

    columns:

      - name: tiempo_key
        data_tests:
          - not_null
          - unique

      - name: fecha
        data_tests:
          - not_null

      - name: hora
        data_tests:
          - not_null

      - name: fecha_hora_inicio
        data_tests:
          - not_null
          - unique

      - name: anio
        data_tests:
          - not_null

      - name: mes_numero
        data_tests:
          - not_null

      - name: es_dia_habil
        data_tests:
          - not_null

      - name: es_hora_pico
        data_tests:
          - not_null